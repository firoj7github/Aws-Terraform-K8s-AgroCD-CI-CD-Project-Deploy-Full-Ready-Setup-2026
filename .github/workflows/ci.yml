name: CI — Build & Push to Docker Hub

on:
  push:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/laravel-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code নাও ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Docker Hub login ────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Build & Push ────────────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

      # ── 4. deployment.yaml এ নতুন image tag বসাও ─────────────────
      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|image: .*|image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" \
            k8s/deployment.yaml

      # ── 5. Updated yaml commit করো ────────────────────────────────
      - name: Commit and push updated deployment.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image to ${{ github.sha }} [skip ci]"
          git push