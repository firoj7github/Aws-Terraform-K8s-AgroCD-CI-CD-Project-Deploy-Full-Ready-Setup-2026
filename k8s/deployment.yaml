apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: laravel-prod
  labels:
    app: laravel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      # ── Docker Hub private repo এর জন্য (public হলে এই block দরকার নেই) ──
      # imagePullSecrets:
      #   - name: dockerhub-secret

      containers:
        - name: laravel
          # ↓ GitHub Actions এই line update করবে automatically
          image: fkfiroj/laravel-app:latest
          ports:
            - containerPort: 80

          # Config & Secret থেকে env নাও
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret

          # Resource limits — HPA এর জন্য দরকার
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
